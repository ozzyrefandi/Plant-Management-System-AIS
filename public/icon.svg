<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b0f17" />
      <stop offset="100%" stopColor="#1e293b" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Industrial Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Outer Protective Industrial Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#eab308" stroke-width="6" stroke-dasharray="16 8" opacity="0.4" />

  <!-- Industrial Gear / Wheel Elements -->
  <g fill="url(#yellowGrad)" filter="url(#glow)">
    <!-- Central Shield / Heavy Equipment Symbol -->
    <path d="M256 95 L375 145 V255 C375 328 324 394 256 422 C188 394 137 328 137 255 V145 Z" fill="#111827" stroke="url(#yellowGrad)" stroke-width="14" stroke-linejoin="round" />

    <!-- Bulldozer / Excavator Boom & Gear Track Graphics inside Shield -->
    <path d="M190 290 L322 290 L310 325 L202 325 Z" fill="url(#yellowGrad)" />
    <circle cx="215" cy="307" r="10" fill="#0b0f17" />
    <circle cx="256" cy="307" r="10" fill="#0b0f17" />
    <circle cx="297" cy="307" r="10" fill="#0b0f17" />

    <!-- Excavator Cabin & Boom Arm -->
    <path d="M210 280 L210 230 L275 230 L285 280 Z" fill="url(#yellowGrad)" />
    <path d="M225 240 L260 240 L260 265 L225 265 Z" fill="#0b0f17" opacity="0.9" />

    <!-- Mechanical Wrench / Reliability Accent -->
    <path d="M245 165 L267 165 L285 195 L272 208 L256 195 L240 208 L227 195 Z" fill="url(#yellowGrad)" />
  </g>

  <!-- Typography: PMS -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="4">
    PMS
  </text>
  <text x="256" y="405" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">
    PLANT MINING
  </text>
</svg>
